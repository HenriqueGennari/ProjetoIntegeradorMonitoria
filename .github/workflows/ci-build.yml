name: CI - Build e Smoke Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Verificar compilação (Prisma Generate & TypeScript Build)
        run: npm run build

  smokes:
    name: Smoke Test
    needs: build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://root@localhost:26257/monitoria_test?schema=public&sslmode=disable&options=-c%20create_table_with_schema_locked=off
      NODE_ENV: test
      JWT_SECRET: smoke-test-secret
      ADMIN_PASSWORD: YWRtaW4xMjM= #precisei colocar pq o seed roda a criação do admin e sem a password e o pepper ele quebra
      ADMIN_PASSWORD_PEPPER: cGVwcGVy

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Iniciar CockroachDB
        run: |
          docker run -d --name cockroach-ci -p 26257:26257 -p 8080:8080 cockroachdb/cockroach:v25.4.10 start-single-node --insecure --store=type=mem,size=0.25
          for i in {1..60}; do
            if docker exec cockroach-ci cockroach sql --insecure -e "SELECT 1" > /dev/null 2>&1; then
              echo "CockroachDB pronto!"
              exit 0
            fi
            echo "Aguardando CockroachDB ficar pronto... (tentativa $i/60)"
            sleep 2
          done
          echo "CockroachDB não ficou pronto a tempo. Logs do container:"
          docker logs cockroach-ci
          exit 1

      - name: Build da aplicação
        run: npm run build

      - name: Criar banco de dados no CockroachDB
        run: |
          docker exec cockroach-ci cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS monitoria_test;"

      - name: Configurar serial normalization do CockroachDB
        run: |
          docker exec cockroach-ci cockroach sql --insecure -e "SET CLUSTER SETTING sql.defaults.serial_normalization = 'sql_sequence';"

      - name: Aplicar migrations do Prisma
        run: npx prisma migrate deploy

      - name: Seed do banco de dados
        run: npx prisma db seed

      - name: Subir aplicação para smoke test
        run: npm start &

      - name: Aguardar aplicação ficar pronta
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Rodar smoke test - Login
        uses: grafana/run-k6-action@v1
        with:
          path: tests/performance/smoke/smoke-login.js
        env:
          BASE_URL: http://localhost:3000

      - name: Rodar smoke test - Monitorias
        uses: grafana/run-k6-action@v1
        with:
          path: tests/performance/smoke/smoke-monitorias.js
        env:
          BASE_URL: http://localhost:3000
  