name: CI - Build e Smoke Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build: #build padrão pra ver se tem erro de compilação 
    name: Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Verificar compilação (Prisma Generate & TypeScript Build)
        run: npm run build

        
  smoke: #smoke do login que só verifica se o endpoint tá acessível e responsivo
    name: Smoke Test
    needs: build 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Build da aplicação
        run: npm run build

      - name: Subir aplicação para smoke test
        run: npm start &
        env:
          NODE_ENV: test

      - name: Aguardar aplicação ficar pronta
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Rodar smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: tests/k6/smoke/smoke-login.js
        env:
          BASE_URL: http://localhost:3000
