name: CI - Build e Smoke Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ============================================================
  # JOB 1: BUILD
  # Verifica se o código compila corretamente
  # ============================================================
  build:
    name: Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Versão LTS recomendada para o ecossistema atual

      - name: Instalar dependências
        run: npm install

      - name: Verificar compilação (Prisma Generate & TypeScript Build)
        run: npm run build

        
  smoke:
    name: Smoke Test
    needs: build 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Build da aplicação
        run: npm run build

      - name: Subir aplicação para smoke test
        run: npm start &
        env:
          NODE_ENV: test

      - name: Aguardar aplicação ficar pronta
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Instalar k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Rodar smoke test
        run: k6 run tests/k6/smoke/smoke-login.js
        env:
          BASE_URL: http://localhost:3000
