name: CI - Build e Smoke Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Verificar compilação (Prisma Generate & TypeScript Build)
        run: npm run build

  smokes:
    name: Smoke Test
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15 #imagem do postgres pra subir com o job fazendo também o healthcheck
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monitoria_test
      NODE_ENV: test
      JWT_SECRET: smoke-test-secret
      ADMIN_PASSWORD: YWRtaW4xMjM= #precisei colocar pq o seed roda a criação do admin e sem a password e o pepper ele quebra
      ADMIN_PASSWORD_PEPPER: cGVwcGVy

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Build da aplicação
        run: npm run build

      - name: Aplicar migrations do Prisma
        run: npx prisma migrate deploy

      - name: Seed do banco de dados
        run: npx prisma db seed

      - name: Subir aplicação para smoke test
        run: npm start &

      - name: Aguardar aplicação ficar pronta
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Rodar smoke test - Login
        uses: grafana/run-k6-action@v1
        with:
          path: tests/k6/smoke/smoke-login.js
        env:
          BASE_URL: http://localhost:3000

      - name: Rodar smoke test - Monitorias
        uses: grafana/run-k6-action@v1
        with:
          path: tests/k6/smoke/smoke-monitorias.js
        env:
          BASE_URL: http://localhost:3000